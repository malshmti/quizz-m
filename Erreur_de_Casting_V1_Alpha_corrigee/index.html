<script>
(function(){'use strict';
const DATA=JSON.parse(document.getElementById('dataset').textContent),API=window.EDC,APP=document.getElementById('app');
const STORAGE='edc_v5_progress';const chapters=['Un jour presque normal','L’enfer, c’est les autres (parfois)','Le prix des convictions','Derrière le masque','Le dernier acte'];
const narrator={1:'Choisis la réponse la plus proche de ce que tu ferais, même si aucune ne correspond exactement.',16:'Pour les questions « Moi réel / moi idéal », tu peux choisir la même réponse dans les deux colonnes.',31:'Tu peux revenir à la question précédente. Si tu changes une réponse, la suite sera à compléter de nouveau.',61:'Les prochaines questions tiennent compte de tes réponses précédentes.'};
function blank(){return {position:0,answers:{},adaptiveIds:[],finished:false}}
let state=blank();try{let saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved&&saved.answers&&Number.isInteger(saved.position))state={...blank(),...saved}}catch(e){}
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}};
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function format(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replaceAll('\n','<br>')}
function setHTML(s){APP.innerHTML=s;const h=APP.querySelector("h1");if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo(0,0)}
function start(){setHTML(`<section class="panel welcome"><div><span class="tag">Convocation n° 001</span><h1 class="heading">Erreur<br>de <em>casting.</em></h1><p class="intro">Tu avais un rôle dans un manga.<br>L’administration a perdu le dossier.</p><p>Le Bureau des Destins doit retrouver le personnage qui partage ta manière de réagir au monde. Sa machine a beaucoup trop confiance en elle. À toi de compliquer les choses.</p><div class="specs"><span><b>75</b>questions</span><span><b>03</b>aventures</span><span><b>01</b>dossier égaré</span></div><button class="btn primary" id="go">${Object.keys(state.answers).length?'Reprendre le dossier':'Entrer au Bureau ↗'}</button><p class="disclaimer">Questionnaire rééquilibré : nouvelle partie pour cette édition.<br>Ton ancien dossier reste conservé dans ce navigateur.</p></div><figure class="cover"><img src="illustrations/brut/bureau.png" width="1024" height="1536" alt="L’Archiviste et le Stagiaire dans le Bureau des Destins, au milieu des dossiers et des livres"><figcaption>Fig. 01 — Le Bureau des Destins.<br>Votre dossier est entre de bonnes mains. Enfin, presque.</figcaption><div class="stamp">À CLASSER… PEUT-ÊTRE.</div></figure><p class="disclaimer" style="grid-column:1/-1;margin:0;border-top:1px solid var(--line);padding-top:18px">Une fiction, pas un diagnostic. Un personnage, un portrait en nuances. Une interprétation ludique de tes réponses, parmi 181 personnages de manga.</p></section>`);document.getElementById('go').onclick=()=>{if(state.position<1)state.position=1;render()}}
function positionQuestion(){if(state.position>=62&&!state.adaptiveIds.length)state.adaptiveIds=API.pickAdaptives(DATA,state);const ids=API.route(DATA,state.adaptiveIds);return API.byId(DATA,ids[state.position-1])}
function render(){if(state.finished)return results();if(state.position<1)return start();const pos=state.position,q=positionQuestion();if(!q){state.position=61;return render()};const scene=API.resolve(DATA,q,state); if(!scene.ready){state.position=Math.max(1,state.position-1);return render()}
 let draft=state.answers[q.id]??(q.kind==='classement'?q.choices.map(c=>c.id):q.kind==='double'?{reel:null,ideal:null}:null);
 const ch=Math.ceil(pos/15);setHTML(`<section class="panel"><div class="row"><div class="kicker">CHAPITRE ${ch} — ${esc(chapters[ch-1])}</div><span class="tiny">${pos} / 75</span></div><div class="chapter-track" aria-label="Chapitres">${chapters.map((name,i)=>`<span class="chapter-mark ${i+1===ch?'current':i+1<ch?'done':''}" ${i+1===ch?'aria-current="step"':''} title="${esc(name)}">${String(i+1).padStart(2,'0')}</span>`).join('')}</div><div class="progress" role="progressbar" aria-label="Questions terminées" aria-valuemin="0" aria-valuemax="75" aria-valuenow="${pos-1}"><div style="width:${((pos-1)/75*100).toFixed(2)}%"></div></div>${narrator[pos]?`<div class="note bureau-note"><span class="bureau-avatar ${pos===46?'intern':'archivist'}" role="img" aria-label="${pos===46?'Le Stagiaire':'L’Archiviste'}"></span><span>${esc(narrator[pos])}</span></div>`:''}<span class="tag">${q.arc?'Aventure : '+esc(q.arc):q.kind==='classement'?'Classement':q.kind==='double'?'Moi réel / moi idéal':'Question'}</span><h1 class="heading">${esc(q.title)}</h1><div class="question">${format(scene.body)}</div><div id="form"></div><div class="footer"><button class="btn" id="back" type="button">← Retour</button><button class="btn primary" id="next" type="button">${pos===75?'Lire mon dossier':'Continuer →'}</button></div><p class="disclaimer">Choisis ce qui se rapproche le plus de ta réaction. C’est une fiction, pas un diagnostic.</p></section>`);
 const form=document.getElementById('form');const next=document.getElementById('next');function valid(){return API.validateAnswer({...q,choices:scene.choices},draft)}
 function draw(){if(q.kind==='classement'){
   form.innerHTML=`<div class="subhead">De la plus importante à la moins importante</div>`+draft.map((id,i)=>{const c=scene.choices.find(x=>x.id===id);return `<div class="order-row"><strong>${i+1}.</strong><span>${format(c?.text||'')}</span><button class="mini" data-move="${i},-1" ${i===0?'disabled':''} aria-label="Monter">↑</button><button class="mini" data-move="${i},1" ${i===3?'disabled':''} aria-label="Descendre">↓</button></div>`}).join('');form.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const [i,step]=b.dataset.move.split(',').map(Number),j=i+step;[draft[i],draft[j]]=[draft[j],draft[i]];draw()});
 }else if(q.kind==='double'){
  form.innerHTML=['reel','ideal'].map(field=>`<div class="subhead">${field==='reel'?'Ce que tu ferais probablement':'Ce que tu aimerais faire'}</div><div class="answers">`+scene.choices.map(c=>`<button class="option ${draft[field]===c.id?'selected':''}" aria-pressed="${draft[field]===c.id}" type="button" data-field="${field}" data-id="${c.id}"><span class="letter">${c.id}</span><span>${format(c.text)}</span></button>`).join('')+'</div>').join('');form.querySelectorAll('[data-field]').forEach(b=>b.onclick=()=>{draft={...draft,[b.dataset.field]:b.dataset.id};draw()});
 }else{form.innerHTML='<div class="answers">'+scene.choices.map(c=>`<button class="option ${draft===c.id?'selected':''}" aria-pressed="${draft===c.id}" type="button" data-id="${c.id}"><span class="letter">${c.id}</span><span>${format(c.text)}</span></button>`).join('')+'</div>';form.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{draft=b.dataset.id;draw()});}
  next.disabled=!valid();}
 draw();document.getElementById('back').onclick=()=>{state.position=Math.max(0,state.position-1);save();render()};
 next.onclick=()=>{if(!valid())return; const previous=state.answers[q.id];const altered=JSON.stringify(previous)!==JSON.stringify(draft);
 if(altered){const routeIds=API.route(DATA,state.adaptiveIds);for(let i=pos;i<routeIds.length;i++)if(routeIds[i])delete state.answers[routeIds[i]];if(pos<=61)state.adaptiveIds=[];}
 state.answers[q.id]=draft;
 if(pos>=75)state.finished=true;else state.position=pos+1;
 save();render();};
}
function results(){
 state.finished=true;save();
 const r=API.evaluate(DATA,state),portrait=window.EDCProfile.build(DATA,state,r),p=portrait.character;
 const evidenceIds=[...new Set(portrait.sections.flatMap(s=>s.evidence))].slice(0,4);
 const evidence=evidenceIds.map(id=>{const q=API.byId(DATA,id),scene=API.resolve(DATA,q,state),raw=state.answers[id];const chosen=Array.isArray(raw)?raw.map(k=>scene.choices.find(c=>c.id===k)?.text).join(' → '):scene.choices.find(c=>c.id===(typeof raw==='string'?raw:raw?.reel))?.text;return '<blockquote><strong>'+esc(q.title)+'</strong><p>'+esc(chosen||'')+'</p></blockquote>';}).join('');
 setHTML('<section class="panel report personal-report"><div class="report-stamp" aria-hidden="true">CASTING RETROUVÉ</div><div class="caps">Le Bureau des Destins a lu ton dossier</div>'+
 (p?'<header class="profile-hero">'+(p.portraitAsset?'<figure><img class="cast-portrait" width="1254" height="1254" src="'+esc(p.portraitAsset)+'" alt="Portrait à l’encre brute de '+esc(p.name)+'"><figcaption>Une ressemblance. Pas une case.</figcaption></figure>':'<div class="character-dossier" aria-hidden="true"><span>LE BUREAU DES DESTINS</span><strong>'+esc(p.name)+'</strong><em>'+esc(p.manga)+'</em><span>DOSSIER RETROUVÉ</span></div>')+'<div><span class="tag">Ton personnage</span><h1 class="heading">'+esc(p.name)+'</h1><p class="manga-name">'+esc(p.manga)+'</p><h2 class="profile-title">'+esc(portrait.title)+'</h2></div></header>':'<h1 class="heading">Ton portrait est encore incomplet.</h1>')+
 (p?.motivation?'<details class="portrait-evidence"><summary>Le personnage derrière ce rapprochement</summary><p>'+esc(p.motivation)+'</p><p>'+esc(p.counterpoint)+'</p><p class="tiny">Période retenue : '+esc(p.period)+'. Le rapprochement porte sur des tendances de réaction, pas sur tous les actes ou les convictions du personnage.</p></details>':'')+'<p class="portrait-intro">'+esc(portrait.introduction)+'</p><div class="profile-story">'+portrait.sections.map((s,i)=>'<section class="story-section"><span class="story-number" aria-hidden="true">'+String(i+1).padStart(2,'0')+'</span><div><h2>'+esc(s.title)+'</h2><p>'+esc(s.text)+'</p></div></section>').join('')+'</div>'+
 (evidence?'<details class="portrait-evidence"><summary>Les choix qui ont nourri ce portrait</summary>'+evidence+'<p class="tiny">Les tendances rédigées s’appuient sur des réactions répétées dans plusieurs situations. Tes priorités et tes réponses idéales sont distinguées de tes réflexes.'+(portrait.closeCall?' Le rapprochement était serré : le Bureau retient un personnage pour raconter ce parcours.':'')+'</p></details>':'')+
 '<div class="footer"><button class="btn primary" id="export">Garder mon dossier (JSON)</button><button class="btn danger" id="restart">Nouvelle partie</button></div><p class="disclaimer">'+esc(portrait.caveat)+'</p>'+
 (p?.source?'<a class="source" href="'+esc(p.source)+'" target="_blank" rel="noreferrer">Découvrir le manga chez son éditeur ↗</a>':'')+'</section>');
 document.getElementById('restart').onclick=reset;
 document.getElementById('export').onclick=()=>{const exportable={version:'6.0-portrait',answers:state.answers,adaptives:state.adaptiveIds,portrait};const blob=new Blob([JSON.stringify(exportable,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bureau-des-destins-mon-portrait.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
}
function reset(){if(!confirm('Effacer la progression sauvegardée dans ce navigateur ?'))return;state=blank();try{localStorage.removeItem(STORAGE)}catch(e){}render()}
document.getElementById('reset').onclick=reset;
const DATA_MOTIFS={HUMOUR_SUR_SOI:'transformer une gêne en autodérision',HUMOUR_JEU:'jouer avec la situation',IMAGE_PROTEGEE:'protéger son image',APPROBATION:'chercher un signe d’approbation',COMPARAISON:'se comparer aux autres',RIPOSTE:'riposter à une contrariété',RETRAIT_CONFLIT:'se retirer d’une tension',FRANCHISE:'exprimer directement ce que l’on pense',RETENUE_EMOTION:'retenir une émotion',EXPRESSION_EMOTION:'montrer ce que l’on ressent',PROXIMITE:'rechercher la proximité',ESPACE_RELATIONNEL:'tenir à son espace personnel',SOUTIEN:'chercher à soutenir quelqu’un',PRINCIPE:'suivre un principe explicite',PETITE_ENTORSE:'accepter un petit arrangement contestable',REVALORISATION_ADVERSE:'reconnaître du mérite à un adversaire',CURIOSITE:'aller comprendre ce qui intrigue',AUTONOMIE:'agir selon ses propres critères',PRECAUTION:'prendre des précautions',RISQUE:'accepter un risque annoncé',ATTACHEMENT_OEUVRE:'être attaché à une activité en elle-même',RECHERCHE_PROGRES:'chercher à progresser',AMBITIONS:'poursuivre un objectif',QUOTIDIEN_SIMPLE:'valoriser la tranquillité',AUTO_EXAMEN:'examiner ses propres réactions',ORIENTATION_PRATIQUE:'chercher une solution praticable',RUMINATION:'ressasser une blessure',NEGOCIATION:'négocier une solution intermédiaire',RETENUE_ORDINAIRE:'renoncer à une impulsion'};
render();
})();
